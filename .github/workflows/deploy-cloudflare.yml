name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Optimize hero portrait
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes webp
          cwebp -quiet -q 82 -m 6 -resize 1200 0 public/assets/images/profile/zeehad-haque-filmmaker.jpg -o public/assets/images/profile/zeehad-haque-filmmaker.webp
          test -s public/assets/images/profile/zeehad-haque-filmmaker.webp
          ls -lh public/assets/images/profile/zeehad-haque-filmmaker.jpg public/assets/images/profile/zeehad-haque-filmmaker.webp
      - name: Type-check and build
        run: npm run build
      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
