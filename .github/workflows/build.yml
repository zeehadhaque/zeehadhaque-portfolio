name: Build verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/zee-filmmaking-academy
      - design/true-3d-cinematic-portfolio
      - motion/complete-cinematic-motion-system
      - fix/complete-motion-build
      - fix/motion-build-selector-order

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Type-check and build
        run: bun run build
