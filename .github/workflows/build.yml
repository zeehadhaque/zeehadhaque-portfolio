name: Build verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/zee-filmmaking-academy
      - design/true-3d-cinematic-portfolio
      - motion/complete-cinematic-motion-system

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
